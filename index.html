<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group Data with Colspan</title>
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Color</th>
          <th>Storage</th>
          <th>Model</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Dữ liệu sẽ được chèn vào đây -->
      </tbody>
    </table>

    <script>
      const data = [
        { color: "Trắng", storage: "64GB", model: "Pro" },
        { color: "Trắng", storage: "128GB", model: "Pro" },
        { color: "Trắng", storage: "256GB", model: "Pro" },
        { color: "Trắng", storage: "512GB", model: "Pro" },
        { color: "Trắng", storage: "64GB", model: "Pro Max" },
        { color: "Trắng", storage: "128GB", model: "Pro Max" },
        { color: "Trắng", storage: "256GB", model: "Pro Max" },
        { color: "Trắng", storage: "512GB", model: "Pro Max" },
        { color: "Đen", storage: "64GB", model: "Pro" },
        { color: "Đen", storage: "128GB", model: "Pro" },
        { color: "Đen", storage: "256GB", model: "Pro" },
        { color: "Đen", storage: "512GB", model: "Pro" },
        { color: "Đen", storage: "64GB", model: "Pro Max" },
        { color: "Đen", storage: "128GB", model: "Pro Max" },
        { color: "Đen", storage: "256GB", model: "Pro Max" },
        { color: "Đen", storage: "512GB", model: "Pro Max" },
        { color: "Xanh", storage: "64GB", model: "Pro" },
        { color: "Xanh", storage: "128GB", model: "Pro" },
        { color: "Xanh", storage: "256GB", model: "Pro" },
        { color: "Xanh", storage: "512GB", model: "Pro" },
        { color: "Xanh", storage: "64GB", model: "Pro Max" },
        { color: "Xanh", storage: "128GB", model: "Pro Max" },
        { color: "Xanh", storage: "256GB", model: "Pro Max" },
        { color: "Xanh", storage: "512GB", model: "Pro Max" },
        { color: "Hồng", storage: "64GB", model: "Pro" },
        { color: "Hồng", storage: "128GB", model: "Pro" },
        { color: "Hồng", storage: "256GB", model: "Pro" },
        { color: "Hồng", storage: "512GB", model: "Pro" },
        { color: "Hồng", storage: "64GB", model: "Pro Max" },
        { color: "Hồng", storage: "128GB", model: "Pro Max" },
        { color: "Hồng", storage: "256GB", model: "Pro Max" },
        { color: "Hồng", storage: "512GB", model: "Pro Max" },
      ];

      const tableBody = document.getElementById("table-body");

      // Nhóm dữ liệu theo màu sắc
      const groupedData = data.reduce((acc, current) => {
        const obj = Object.keys(current);
        const firstValue = current[obj[0]];
        if (!acc[firstValue]) {
          acc[firstValue] = 0;
        }
        acc[firstValue]++;
        return acc;
      }, {});
      // Hiển thị dữ liệu vào bảng
      Object.keys(groupedData).forEach((color) => {
        const items = groupedData[color];

        // Lấy item đầu tiên để hiển thị giá trị màu
        const firstItem = items[0];

        // Dòng đầu tiên chứa color
        const row = document.createElement("tr");
        const colorCell = document.createElement("td");
        colorCell.rowSpan = items.length; // Dùng rowSpan để gộp các ô có cùng màu
        colorCell.textContent = color;
        row.appendChild(colorCell);

        // Dòng đầu tiên sẽ có giá trị cho Storage và Model
        const storageCell = document.createElement("td");
        storageCell.textContent = firstItem.storage;
        row.appendChild(storageCell);

        const modelCell = document.createElement("td");
        modelCell.textContent = firstItem.model;
        row.appendChild(modelCell);

        // Thêm dòng đầu tiên vào bảng
        tableBody.appendChild(row);

        // Các dòng tiếp theo sẽ không hiển thị color nữa, chỉ có storage và model
        items.slice(1).forEach((item) => {
          const newRow = document.createElement("tr");
          const storageCell = document.createElement("td");
          storageCell.textContent = item.storage;
          newRow.appendChild(storageCell);

          const modelCell = document.createElement("td");
          modelCell.textContent = item.model;
          newRow.appendChild(modelCell);

          tableBody.appendChild(newRow);
        });
      });
    </script>
  </body>
</html>
